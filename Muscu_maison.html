<script>
const AN=(()=>{
// ---------- moteur : squelette 2D articulé (unités ≈ cm, sol à y=0, y vers le bas) ----------
const R=Math.PI/180,dr=a=>[Math.sin(a*R),Math.cos(a*R)],ag=(x,y)=>Math.atan2(x,y)/R,
ad=(p,a,l)=>[p[0]+Math.sin(a*R)*l,p[1]+Math.cos(a*R)*l],r1=n=>Math.round(n*10)/10;
const K={th:44,sh:43,ua:29,fa:26,to:50,nk:8,hr:10.5,ft:13,sw:16,hw:8.5};
function ik(r,g,a,b,s){const dx=g.x-r[0],dy=g.y-r[1];let d=Math.hypot(dx,dy);d=Math.min(Math.max(d,Math.abs(a-b)+.1),a+b-.05);const u=ag(dx,dy)+s*Math.acos((a*a+d*d-b*b)/(2*a*d))/R,j=ad(r,u,a);return[u,ag(g.x-j[0],g.y-j[1])]}
function solve(P,X){const F=X.v=='f',o=P.t-180;
 const run=(hp,full)=>{const J={hp},pd=P.t-90;
  J.nb=ad(hp,P.t,K.to);J.hd=ad(J.nb,P.t+P.n,K.nk+K.hr);
  const sh=ad(hp,P.t,K.to-2+P.e);
  J.as=F?ad(sh,pd,K.sw):sh;J.As=F?ad(sh,pd,-K.sw):sh;
  J.lh=F?ad(hp,pd,K.hw):hp;J.Lh=F?ad(hp,pd,-K.hw):hp;
  for(const k of 'aAlL'){const arm=k=='a'||k=='A',m=F&&(k=='A'||k=='L'),s=P[k],r=J[k+(arm?'s':'h')],L1=arm?K.ua:K.th,L2=arm?K.fa:K.sh;let u,f,s1=1,s2=1;
   if(Array.isArray(s)){u=m?o-s[0]:s[0]+o;f=m?o-s[1]:s[1]+o;s1=s[2]??1;s2=s[3]??s1}
   else{if(!full)continue;[u,f]=ik(r,s,L1,L2,s.s)}
   const j1=ad(r,u,L1*s1),j2=ad(j1,f,L2*s2);J[k+'u']=u;J[k+'f']=f;J[k+'1']=s1;J[k+'2']=s2;
   if(arm){J[k+'e']=j1;J[k+'w']=j2;J[k+'h']=ad(j2,f,4*s2)}
   else{J[k+'k']=j1;J[k+'a']=j2;const ft=P[k=='l'?'f':'F'];const fa=ft!=null?(m?-ft:ft):F?f+(m?-70:70):f+78;J[k+'t']=ad(j2,fa,F?8:K.ft)}}
  return J};
 let hp=[P.x,P.y];if(X.an){const L=run([0,0],0)[X.an];hp=[P.x-L[0],P.y-L[1]]}
 return run(hp,1)}
// ---------- interpolation ----------
function mix(a,b,u){if(typeof a=='number')return typeof b=='number'?a+(b-a)*u:a;if(Array.isArray(a))return a.map((v,i)=>mix(v,b[i],u));if(a&&typeof a=='object'){const r={};for(const k in a)r[k]=k=='s'?a[k]:mix(a[k],b[k],u);return r}return a}
const D0={x:0,y:-91,t:180,n:0,e:0,a:[-4,4],l:[0,0],ds:1};
function prep(X){if(X.K)return X;const F=X.v=='f';
 X.K=X.k.map(k=>{const P={...D0,...X.b,...k};
  if(P.A==null)P.A=F&&!Array.isArray(P.a)?{x:2*P.x-P.a.x,y:P.a.y,s:-P.a.s}:P.a;
  if(P.L==null)P.L=F&&!Array.isArray(P.l)?{x:2*P.x-P.l.x,y:P.l.y,s:-P.l.s}:P.l;
  if(P.F==null&&P.f!=null)P.F=P.f;return P});
 const ks=new Set();X.K.forEach(k=>Object.keys(k).forEach(n=>ks.add(n)));
 ks.forEach(n=>{const d=X.K.find(k=>k[n]!=null);X.K.forEach(k=>{if(k[n]==null)k[n]=d[n]})});
 X.T=X.p.reduce((s,p)=>s+p[0],0);X.db=X.db||{};return X}
function at(X,t){let x=((t%X.T)+X.T)%X.T,i=0;while(i<X.p.length-1&&x>X.p[i][0]){x-=X.p[i][0];i++}
 const u=Math.min(1,x/X.p[i][0]),e=(1-Math.cos(Math.PI*u))/2,A=X.K[i],B=X.K[(i+1)%X.K.length],P={};
 for(const k in A)P[k]=mix(A[k],B[k],e);
 const pe=X.p[(i+X.p.length-1)%X.p.length][3],ce=X.p[i][3];
 return{P,i,u,ef:pe+(ce-pe)*Math.min(1,u*3)}}
// ---------- dessin ----------
const L=(p,q,w,c)=>`<line x1="${r1(p[0])}" y1="${r1(p[1])}" x2="${r1(q[0])}" y2="${r1(q[1])}" stroke-width="${w}" class="${c}"/>`,
C=(p,r,c,x='')=>`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="${r1(r)}" class="${c}"${x}/>`,
E=(p,a,rx,ry,c,x='')=>`<ellipse cx="${r1(p[0])}" cy="${r1(p[1])}" rx="${r1(rx)}" ry="${r1(ry)}" transform="rotate(${r1(90-a)} ${r1(p[0])} ${r1(p[1])})" class="${c}"${x}/>`;
function blob(pts,c){const n=pts.length,m=(p,q)=>`${r1((p[0]+q[0])/2)} ${r1((p[1]+q[1])/2)}`;let d=`M${m(pts[n-1],pts[0])}`;for(let i=0;i<n;i++)d+=`Q${r1(pts[i][0])} ${r1(pts[i][1])} ${m(pts[i],pts[(i+1)%n])}`;return`<path d="${d}Z" class="${c}"/>`}
const PS=[[-.1,6,9.5],[.1,7,10.5],[.4,7.5,8],[.7,10.5,9],[.9,9,9],[1,5,7],[1.06,3,4]],
PF=[[-.12,13],[.1,14.5],[.45,12.5],[.72,15.5],[.92,18],[1.01,13],[1.06,5]];
// muscles : [segment, position le long, décalage, rx, ry]  T=tronc u=bras f=avant-bras U=cuisse S=jambe D=deltoïde
const MS={pec:[['T',.8,8,8,4.5]],abs:[['T',.38,7,11,3]],obl:[['T',.42,0,10,5]],dos:[['T',.64,-7.5,13,4.5]],trap:[['T',.98,-5,6,4]],lomb:[['T',.2,-8,8,3.5]],glu:[['T',-.03,-7.5,6.5,6.5]],
 delt:[['D',.12,0,7,6.5]],bic:[['u',.52,2.6,9,3.6]],tri:[['u',.5,-2.6,9.5,3.6]],fa:[['f',.3,0,7,3]],quad:[['U',.5,3.5,15,5]],isch:[['U',.5,-3.5,14,4.5]],psoas:[['U',.1,4,6,4.5]],calf:[['S',.28,-2.5,10,4]]},
MF={pec:[['T',.8,7.5,7,5],['T',.8,-7.5,7,5]],abs:[['T',.4,0,11,6]],obl:[['T',.4,11,9,3.5],['T',.4,-11,9,3.5]],dos:[['T',.62,12,11,3.5],['T',.62,-12,11,3.5]],trap:[['T',.99,8,3,7],['T',.99,-8,3,7]],
 lomb:[['T',.2,5,7,3],['T',.2,-5,7,3]],glu:[['T',-.05,7,6,6],['T',-.05,-7,6,6]],delt:[['D',.1,0,6.5,6.5]],bic:[['u',.5,0,9,4]],tri:[['u',.5,0,9,4]],fa:[['f',.3,0,7,3]],quad:[['U',.5,0,15,6]],isch:[['U',.5,0,14,5]],psoas:[['U',.12,0,6,4.5]],calf:[['S',.3,0,10,4]]};
function muscles(J,P,X,seg,k,ef){if(!ef)return'';const F=X.v=='f',T=F?MF:MS;let s='';
 const one=(list,cl,op)=>{for(const m of list||[])for(const q of T[m]||[]){if(q[0]!=seg)continue;let p,a;
  if(seg=='T'){a=P.t;p=ad(ad(J.hp,P.t,K.to*q[1]),P.t-90,q[2])}
  else{const arm='uDf'.includes(seg),up='uDU'.includes(seg),r=up?J[k+(arm?'s':'h')]:J[k+(arm?'e':'k')];a=J[k+(up?'u':'f')];const ln=(arm?(up?K.ua:K.fa):(up?K.th:K.sh))*J[k+(up?'1':'2')];p=ad(ad(r,a,ln*q[1]),a+90,F?0:q[2])}
  s+=E(p,a,q[3],q[4],cl,` opacity="${r1(op)}"`)}};
 one(X.m,X.st?'ms':'mu',.3+.7*ef);one(X.m2,X.st?'ms':'mu',.15+.35*ef);return s}
function dumb(h,ax,w,s){const d=dr(ax),l=7.5*w*s,p1=[h[0]-d[0]*l,h[1]-d[1]*l],p2=[h[0]+d[0]*l,h[1]+d[1]*l],rx=(2.6+4.6*(1-w))*s,ry=7.2*s;
 return L(p1,p2,2.8*s,'dh')+E(p1,ax,rx,ry,'dp')+E(p2,ax,rx,ry,'dp')+(w<.35?C(h,2.4*s,'dhc'):'')}
function bells(J,P,X,k){const B=X.db;if(!B.h)return'';const pos=B.h=='c'||B.h=='hip'?'a':B.h;if(!pos.includes(k))return'';
 const h=B.h=='hip'?ad(J.hp,P.t-90,12):J[k+'h'],fa=J[k+'f'],ax=B.o=='a'?fa:B.o=='t'?P.t:fa+90,w=B.h=='hip'?0:(k=='A'?P.W:P.w)??B.w??0;return dumb(h,ax,w,P.ds)}
function arm(J,P,X,k,c,ef,g){const s=J[k+'s'],e=J[k+'e'],w=J[k+'w'],h=J[k+'h'];
 return L(s,e,10,c)+(g?'':muscles(J,P,X,'u',k,ef)+muscles(J,P,X,'D',k,ef))+L(e,w,8,c)+(g?'':muscles(J,P,X,'f',k,ef))+C(h,4.6,c+'f')+bells(J,P,X,k)}
function leg(J,P,X,k,c,ef,g){const h=J[k+'h'],kn=J[k+'k'],a=J[k+'a'],t=J[k+'t'];
 return L(h,kn,15,c)+(g?'':muscles(J,P,X,'U',k,ef))+L(kn,a,11.5,c)+(g?'':muscles(J,P,X,'S',k,ef))+L(a,t,6.5,c)}
function torso(J,P,X,ef,g){const F=X.v=='f',nf=P.t-90,pts=[];
 if(F){for(const q of PF)pts.push(ad(ad(J.hp,P.t,K.to*q[0]),nf,q[1]));for(const q of [...PF].reverse())pts.push(ad(ad(J.hp,P.t,K.to*q[0]),nf,-q[1]))}
 else{for(const q of PS)pts.push(ad(ad(J.hp,P.t,K.to*q[0]),nf,q[1]));for(const q of [...PS].reverse())pts.push(ad(ad(J.hp,P.t,K.to*q[0]),nf,-q[2]))}

let kind='muscle',sel=new Set(),dsel=new Set(),dv=0,ds=0,cd=null,cy=0,cm=0,log=ls.g('log',{}),lvl=0,mode='reps',cfg={},links=ls.g('links',{});
function paint(){document.querySelectorAll('.z').forEach(z=>z.classList.toggle('on',(z.closest('#s4')?dsel:sel).has(z.dataset.m)));
$('#chips').innerHTML=[...sel].map(m=>`<span class="chip">${M[m]}</span>`).join('')||'<span class="sub">Aucune zone</span>';$('#ok').disabled=!(kind=='velo'||sel.size);$('#dch').innerHTML=[...dsel].map(m=>`<span class="chip">${M[m]}</span>`).join('')||'<span class="sub">Aucune zone</span>'}
document.addEventListener('click',ev=>{const z=ev.target.closest('.z');if(z){const m=z.dataset.m;const S=z.closest('#s4')?dsel:sel;S.has(m)?S.delete(m):S.add(m);paint()}});
paint();
function go(n){['s1','s2','s3','s4'].forEach((id,i)=>$('#'+id).hidden=i!=n-1);scrollTo(0,0)}
$('#b1').onclick=()=>go(1);$('#kd').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;kind=b.dataset.k;document.querySelectorAll('#kd button').forEach(x=>x.classList.toggle('on',x==b));const v=kind=='velo';$('.bodies').style.display=v?'none':'';$('#chips').style.display=v?'none':'';$('#s1t').textContent=v?'Gainage, jambes et dos pour la puissance et le confort sur le vélo.':kind=='st'?'Touche les zones à étirer.':'Touche une ou plusieurs zones.';paint()};$('#b2').onclick=()=>go(2);
$('#lv').innerHTML=[1,2,3].map(i=>`<button data-l="${i}">${L[i].n}<small>${L[i].s} séries × ${L[i].r} reps · ${L[i].ex} exos/muscle</small></button>`).join('');
$('#lv').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;lvl=+b.dataset.l;document.querySelectorAll('#lv button').forEach(x=>x.classList.toggle('on',x==b));$('#tn2').value=L[lvl].tr};
$('#md').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;mode=b.dataset.m;document.querySelectorAll('#md button').forEach(x=>x.classList.toggle('on',x==b));$('#tb').hidden=mode!='tab'};
const url=x=>links[x.n]||'https://www.youtube.com/results?search_query='+encodeURIComponent(x.q+' exercice');
function card(x,l,t){const w=/alt[eè]re/i.test(x.n+x.d),k=ls.g('kg:'+x.n,'');
return `<div class="c"><b>${x.n}</b><div class="rp">${t?`Tabata ${cfg.w} s / ${cfg.r} s × ${cfg.n}`:/^(Planche|Squat isom)/.test(x.n)?`${l.s} × ${l.p} s`:`${l.s} × ${l.r} reps`}</div><p>${x.d}</p>${w?`<label>Charge par altère (kg)<input type="number" step="0.5" inputmode="decimal" data-k="${x.n}" value="${k}"></label>`:''}${AN.has(x.n)?`<div class="anw" data-an="${x.n}"></div>`:''}<div class="bt"><a href="${url(x)}" target="_blank" rel="noopener">▶ Vidéo</a><button data-tg>🎬 Animation</button><button data-e="${x.n}">✎ Lien</button>${t?'':'<button data-rest="1">⏱ Repos</button>'}</div></div>`}
let list=[];
$('#ok').onclick=()=>kind=='st'?gst():go(2);$('#go').onclick=()=>{ro=0;gen()};$('#rot').onclick=()=>{ro++;gen()};let ro=0;
function scard(x){return `<div class="c"><b>${x.n}</b><div class="rp">${side(x)?'30 s × 2 côtés':'30 s'}</div><p>${x.d}</p>${AN.has(x.n)?`<div class="anw" data-an="${x.n}"></div>`:''}<div class="bt"><a href="${url(x)}" target="_blank" rel="noopener">▶ Vidéo</a><button data-tg>🎬 Animation</button><button data-e="${x.n}">✎ Lien</button><button data-h="${x.n}">⏱ Timer</button></div></div>`}
function gst(){let h='';list=[];sel.forEach(m=>{h+=`<h3>${M[m]}</h3>`;D.filter(x=>x.m=='st:'+m).forEach(x=>{list.push(x);h+=scard(x)})});$('#list').innerHTML=h;AN.scan($('#list'));$('#ttl').textContent='🧘 Étirements';$('#inf').textContent=list.length+' étirements · 30 s · muscles chauds, sans douleur, sans rebond';$('#tab').textContent='▶ Lancer les étirements';$('#tab').hidden=false;$('#rot').hidden=true;$('#dt').hidden=true;go(3)}
function gen(){if(!lvl){alert('Choisis un niveau');return}
const l=L[lvl],t=mode=='tab';cfg={w:+$('#tw').value||20,r:+$('#tr').value||0,n:+$('#tn2').value||1,p:+$('#tp2').value||0};
let h='';list=[];(kind=='velo'?V.slice(0,[0,7,9,11][lvl]).map(n=>D.find(y=>y.n==n)):[]).forEach(x=>{list.push(x);h+=card(x,l,t)});if(kind!='velo')sel.forEach(m=>{h+=`<h3>${M[m]}</h3>`;(m=>{const E=D.filter(x=>x.m==m);return E.slice(0,Math.min(l.ex,E.length)).map((_,i)=>E[(ro*l.ex+i)%E.length])})(m).forEach(x=>{list.push(x);h+=card(x,l,t)})});
$('#list').innerHTML=h;AN.scan($('#list'));$('#ttl').textContent=(kind=='velo'?'🚴 Vélo · ':'')+l.n;$('#inf').textContent=t?`Tabata · ${list.length} exercices`:`${l.s} séries × ${l.r} reps · repos ${l.rest} s`;
$('#tab').hidden=!t;$('#rot').hidden=kind=='velo';$('#tab').textContent='▶ Lancer le tabata';$('#dt').hidden=false;
$('#adv').innerHTML=`<li><b>Charge de départ</b> (indicatif, par altère) : haut du corps ${l.h}, bas du corps ${l.b}.</li><li>Choisis une charge qui rend les 2 dernières reps difficiles mais propres.</li><li><b>Double progression</b> : quand tu atteins le haut de la fourchette (${l.r.split('–')[1]} reps) sur toutes les séries, ajoute 1–2 kg (haut du corps) ou 2–4 kg (bas du corps), puis repars du bas de la fourchette.</li><li>Technique qui se dégrade : ne monte pas.</li><li>Altères trop légères et plus de cran possible : descente en 3 s, pause en bas, ou version à un bras / une jambe.</li><li>Une seule variable à la fois : charge OU reps OU séries.</li><li>48 h entre deux séances du même muscle. Toutes les 6–8 semaines : semaine allégée (−20 % de charge).</li>`;
go(3)}
$('#list').addEventListener('input',ev=>{const k=ev.target.dataset.k;if(k)ls.s('kg:'+k,ev.target.value)});
$('#list').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
if(b.dataset.tg!=null){const w=b.closest('.c').querySelector('.anw');if(w)w.hidden=!w.hidden;return}
if(b.dataset.e){const x=D.find(y=>y.n==b.dataset.e),v=prompt('Lien YouTube pour « '+x.n+' » (vide = lien par défaut) :',links[x.n]||'');if(v===null)return;v.trim()?links[x.n]=v.trim():delete links[x.n];ls.s('links',links);
b.closest('.c').querySelector('a').href=url(x)}
if(b.dataset.h)run(hold(D.find(y=>y.n==b.dataset.h)));if(b.dataset.rest)run([{t:'REPOS',n:'Récupère',d:L[lvl].rest}])});
$('#tab').onclick=()=>{if(kind=='st'){run(list.flatMap(x=>hold(x)));return}const s=[];list.forEach((x,i)=>{if(i&&cfg.p)s.push({t:'PAUSE',n:'Prochain : '+x.n,d:cfg.p,x:x.n});for(let k=1;k<=cfg.n;k++){s.push({t:'TRAVAIL',n:x.n,d:cfg.w,i:'Tour '+k+'/'+cfg.n,x:x.n});if(cfg.r&&k<cfg.n)s.push({t:'REPOS',n:x.n,d:cfg.r,i:'Tour '+k+'/'+cfg.n,x:x.n})}});run(s)};
const T=new Date(),pad=n=>String(n).padStart(2,'0'),ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function cal(){const first=(new Date(cy,cm,1).getDay()+6)%7,n=new Date(cy,cm+1,0).getDate(),td=ymd(T.getFullYear(),T.getMonth(),T.getDate());let h='LMMJVSD'.split('').map(c=>`<i>${c}</i>`).join('')+'<span></span>'.repeat(first),k=0;
for(let d=1;d<=n;d++){const id=ymd(cy,cm,d),g=log[id];if(g)k++;h+=`<button data-d="${id}" class="${id==td?'td ':''}${g?'dn ':''}${id==cd?'sl':''}">${d}<small>${g?(g.m.length||'')+(g.v?'🚴':'')+(g.s?'🧘':''):''}</small></button>`}
$('#cg').innerHTML=h;$('#mt').textContent=new Date(cy,cm,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});$('#ms').textContent=k+' jour(s) actif(s) ce mois'}
function flags(){$('#bvl').classList.toggle('on',!!dv);$('#bst').classList.toggle('on',!!ds)}
function openDay(id){cd=id;const g=log[id]||{m:[],v:0,s:0};dsel=new Set(g.m);dv=g.v;ds=g.s;$('#dd').textContent=new Date(id+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});$('#de').hidden=false;flags();paint();cal()}
function endDay(){ls.s('log',log);cd=null;$('#de').hidden=true;cal()}
$('#b0').onclick=()=>{cy=T.getFullYear();cm=T.getMonth();cd=null;$('#de').hidden=true;cal();go(4)};
$('#b4').onclick=()=>go(1);
$('#pm').onclick=()=>{if(--cm<0){cm=11;cy--}cal()};
$('#nm').onclick=()=>{if(++cm>11){cm=0;cy++}cal()};
$('#cg').onclick=ev=>{const b=ev.target.closest('button[data-d]');if(b)openDay(b.dataset.d)};
$('#bvl').onclick=()=>{dv=dv?0:1;flags()};$('#bst').onclick=()=>{ds=ds?0:1;flags()};
$('#dsv').onclick=()=>{if(dsel.size||dv||ds)log[cd]={m:[...dsel],v:dv,s:ds};else delete log[cd];endDay()};
$('#dx').onclick=()=>{delete log[cd];endDay()};
let st=[],ix=0,left=0,iv=null,ps=false;
function beep(long){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=long?520:880;o.start();o.stop(c.currentTime+(long?.6:.15))}catch(e){}try{navigator.vibrate&&navigator.vibrate(long?300:80)}catch(e){}}
function draw(){const s=st[ix];$('#tm').dataset.p=s.t;$('#tp').textContent=s.t;$('#tn').textContent=s.n;$('#ti').textContent=(s.i||'')+(st.length>1?' · étape '+(ix+1)+'/'+st.length:'');$('#tc').textContent=left}
let aK=null;function anim(s){const k=s.x?s.x+(s.m?'|m':''):'';if(k===aK)return;aK=k;const ok=!!s.x&&AN.has(s.x);$('#tm').classList.toggle('ha',ok);if(ok)AN.mount($('#ta'),s.x,{mini:1,mirror:s.m});else{AN.stop($('#ta'));$('#ta').hidden=true}}
function load(){left=st[ix].d;draw();anim(st[ix]);beep(1)}
function run(s){st=s;ix=0;aK=null;ps=false;$('#pa').textContent='Pause';$('#tm').hidden=false;clearInterval(iv);load();iv=setInterval(tick,1000)}
function tick(){if(ps)return;left--;if(left<=0){ix++;if(ix>=st.length){clearInterval(iv);$('#tp').textContent='TERMINÉ 💪';$('#tc').textContent='✓';beep(1);return}load()}else{draw();if(left<=3)beep()}}
$('#pa').onclick=()=>{ps=!ps;$('#pa').textContent=ps?'Reprendre':'Pause'};
$('#sk').onclick=()=>{if(ix<st.length-1){ix++;load()}else{ix=st.length-1;left=0}};
$('#cl').onclick=()=>{clearInterval(iv);$('#tm').hidden=true;AN.stop($("#ta"));aK=null};
</script></body></html>
